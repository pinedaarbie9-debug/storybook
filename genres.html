<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genres — Storybook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="genres">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="container">
      <div class="page-title">
        <h1>Genres</h1>
        <p class="muted">Pick a mood and dive in.</p>
      </div>
      <section class="section" aria-label="All genres">
        <div class="genre-grid" id="genre-tiles"></div>
      </section>
      <section class="section" aria-labelledby="saved-h">
        <div class="section-head"><h2 id="saved-h">Your saved books</h2></div>
        <div class="book-grid" id="saved-grid"></div>
        <div class="empty" id="saved-empty" hidden>
          <h3>No saved books yet</h3>
          <p class="muted">Tap the ☆ on any book to save it here.</p>
          <p style="margin-top:14px"><a class="btn" href="explore.html">Find a story</a></p>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/data-a.js"></script>
  <script src="js/data-b.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
